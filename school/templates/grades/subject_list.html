<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <table>
        <caption>Список оцінок</caption>
        {% for subject in subjects %} <!-- беремо предмет зі списку предметів -->
        <tr>
            <td>{{ subject.name }}</td> <!-- показуємо назву предмета -->
        </tr>
        <tr>
            <td>{{ subject.grades }}</td> <!-- показуємо оцінки зв'язані до предмета -->
        </tr>
        {% endfor %}
    </table>
</body>
</html>
